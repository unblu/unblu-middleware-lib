plugins {
    id 'java-library'
}

group "com.unblu.middleware"

java {
    withJavadocJar()
    withSourcesJar()
    compileJava.options.encoding = "UTF-8"

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    api "io.projectreactor:reactor-core:3.8.2"
    api "io.projectreactor.addons:reactor-extra:3.6.0"
    api "io.micrometer:context-propagation:1.2.0"
    api "jakarta.annotation:jakarta.annotation-api:3.0.0"
    api "jakarta.validation:jakarta.validation-api:4.0.0-M1"

    // Lombok
    api "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Logging
    api "org.slf4j:slf4j-api:2.0.16"
    api "ch.qos.logback:logback-classic:1.5.27"
    api "net.logstash.logback:logstash-logback-encoder:[7.4,)"

    // Unblu API client
    api "com.unblu.openapi:jersey3-client-v4:[8.0.0,)"

    // Utilities
    api "com.google.guava:guava:[32.1.2-jre,)"
    api "org.skyscreamer:jsonassert:2.0-rc1"
    api "commons-codec:commons-codec:1.21.0"

    // Testing
    testImplementation "io.projectreactor:reactor-test:3.8.2"
    testImplementation platform("org.junit:junit-bom:6.1.0-M1")
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

test {
    useJUnitPlatform()
    // use this to see the output of tests (e.g. Spring dependency problems)
    // testLogging.showStandardStreams = true
}

