dependencies {
    api "io.projectreactor:reactor-core:3.8.2"
    api "io.projectreactor.addons:reactor-extra:3.6.0"
    api "io.micrometer:context-propagation:1.2.0"
    api "jakarta.annotation:jakarta.annotation-api:3.0.0"
    api "jakarta.validation:jakarta.validation-api:3.1.1"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    api "org.slf4j:slf4j-api:2.0.16"

    api "com.unblu.openapi:jersey3-client-v4:[8.37.0, 9.0.0)"

    implementation "org.skyscreamer:jsonassert:2.0-rc1"
    api "commons-codec:commons-codec:1.21.0"

    testImplementation "io.projectreactor:reactor-test:3.8.2"
    testImplementation project(':unblu-middleware-lib-core-webhooks')
    testImplementation project(':unblu-middleware-lib-core-outboundrequests')
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.mockito:mockito-core:5.19.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

test {
    useJUnitPlatform()
}
