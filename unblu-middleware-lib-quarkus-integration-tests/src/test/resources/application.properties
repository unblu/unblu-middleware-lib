# Quarkus Integration Test Configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true

# Disable native image builder (not needed for tests)
quarkus.native.enabled=false
quarkus.package.type=fast-jar

# Test mode
%test.quarkus.log.level=DEBUG

# Disable dev services for tests
quarkus.devservices.enabled=false

# Unblu API client configuration (test values)
unblu.host=http://localhost:8080
unblu.api-base-path=/app/rest/v4
unblu.user=test-user
unblu.password=test-password

# Middleware configuration
unblu.middleware.url=http://localhost:9090
unblu.middleware.name=test-middleware
unblu.middleware.description=Integration test middleware
unblu.middleware.auto-subscribe=false
unblu.middleware.auto-register=false
unblu.middleware.self-healing-enabled=false
unblu.middleware.ping-unblu-on-startup=false

# Webhook configuration
unblu.webhook.api-path=/webhook
unblu.webhook.secret=test-webhook-secret

# Outbound requests configuration
unblu.outbound-requests.api-path=/outbound
unblu.outbound-requests.secret=test-outbound-secret

