plugins {
    id "java"
    id "maven-publish"
    id "org.jreleaser" version '1.19.0'
    id "net.researchgate.release" version '3.1.0'
}

wrapper {
    gradleVersion = '8.14'
    distributionType = 'all'
}

allprojects {
    group "com.unblu.middleware"
    version rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'maven-publish'

    if (project.name != 'unblu-middleware-lib-bom') {
        apply plugin: 'java-library'

        java {
            withJavadocJar()
            withSourcesJar()
            compileJava.options.encoding = "UTF-8"

            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    // Ensure deployment artifacts are resolvable from project dependencies.
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module("com.unblu.middleware:unblu-middleware-lib-quarkus-deployment") using project(":unblu-middleware-lib-quarkus-deployment")
        }
    }

    repositories {
        mavenCentral()
    }

    if (project.name.startsWith('unblu-middleware-lib-quarkus-')
            && project.name != 'unblu-middleware-lib-quarkus-deployment'
            && project.name != 'unblu-middleware-lib-quarkus-integration-tests') {
        def isReleaseBuild = gradle.startParameter.taskNames.any { it == 'release' || it.endsWith(':release') }
        def configurationProjectVersion = project.version.toString()
        def packagingProjectVersion = project.findProperty('release.releaseVersion')
                ?: (isReleaseBuild ? project.version.toString().replace('-SNAPSHOT', '') : project.version)
        def generatedExtensionResourcesDir = file("$buildDir/generated/quarkus-extension-resources")
        def generatedMetaInfDir = new File(generatedExtensionResourcesDir, "META-INF")
        def extensionTemplateFile = file("src/main/resources/META-INF/quarkus-extension.yaml.template")
        def extensionYamlFile = new File(generatedMetaInfDir, "quarkus-extension.yaml")
        def extensionPropertiesFile = new File(generatedMetaInfDir, "quarkus-extension.properties")

        def writeExtensionMetadata = { String version ->
            generatedMetaInfDir.mkdirs()
            extensionYamlFile.text = extensionTemplateFile.text
                    .replace('${projectGroup}', project.group.toString())
                    .replace('${projectArtifactId}', project.name)
                    .replace('${projectVersion}', version)
            extensionPropertiesFile.text =
                    "deployment-artifact=${project.group}\\:unblu-middleware-lib-quarkus-deployment\\:${version}\n"
        }

        writeExtensionMetadata(configurationProjectVersion)

        sourceSets.main.resources {
            srcDir(generatedExtensionResourcesDir)
            exclude('META-INF/quarkus-extension.yaml')
            exclude('META-INF/quarkus-extension.properties')
        }

        tasks.named('processResources') {
            doFirst {
                writeExtensionMetadata(packagingProjectVersion.toString())
            }
        }
    }

    afterEvaluate {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    pom {
                        name = project.name
                        description = "Part of Unblu middleware lib - ${project.name}"
                        packaging = plugins.hasPlugin('java-platform') ? 'pom' : 'jar'
                        url = 'https://' + "$githubRepositoryOwner" + '.github.io/' + "$githubRepositoryName" + '/'
                        licenses {
                            license {
                                name = 'Apache 2.0 License'
                                url = 'http://www.apache.org/licenses/LICENSE-2.0'
                            }
                        }
                        developers {
                            developer {
                                id = 'unblu'
                                url = 'https://github.com/orgs/' + "$githubRepositoryOwner" + '/people'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/' + "$githubRepositoryOwner" + '/' + "$githubRepositoryName" + '.git'
                            developerConnection = 'scm:git:https://github.com/' + "$githubRepositoryOwner" + '/' + "$githubRepositoryName" + '.git'
                            url = 'https://github.com/' + "$githubRepositoryOwner" + '/' + "$githubRepositoryName" + '/'
                        }
                    }

                    if (plugins.hasPlugin('java-platform')) {
                        from components.javaPlatform
                    } else {
                        from components.java
                    }
                }
            }
            repositories {
                maven {
                    url = rootProject.file('build/staging-deploy')
                }
            }
        }
    }
}

tasks.register('checkLastVersionValue') {
    doLast {
        if(version.endsWith('SNAPSHOT')) {
            throw new GradleException("version '$version' ends with SNAPSHOT, this is not a release build!")
        }
        if(lastVersion != version) {
            throw new GradleException("lastVersion '$lastVersion' does not match version '$version', fix it in the 'gradle.properties' file.")
        }
    }
}

tasks.register('verifyForRelease', GradleBuild) {
    dir = rootDir
    tasks = ['check']
}

tasks.register('checkNoSnapshotDependencies') {
    doLast {
        def snapshotDependencies = [] as Set

        allprojects.toList().each { currentProject ->
            currentProject.configurations.toList().each { configuration ->
                configuration.dependencies.toList().each { dependency ->
                    if (dependency instanceof ExternalModuleDependency && dependency.version?.contains('SNAPSHOT')) {
                        snapshotDependencies << "${currentProject.path}:${configuration.name} -> ${dependency.group}:${dependency.name}:${dependency.version}"
                    }
                }
            }
        }

        if (!snapshotDependencies.isEmpty()) {
            throw new GradleException("Snapshot dependencies found:\n" + snapshotDependencies.sort().join('\n'))
        }
    }
}

def updateLastVersionValueTask = tasks.register('updateLastVersionValue') {
    doLast {
        def propertiesFile = file('gradle.properties')
        def content = propertiesFile.text
        def newVersion = project.findProperty('release.releaseVersion') ?: version.replace('-SNAPSHOT', '')
        content = content.replaceAll("lastVersion=[0-9a-z\\.\\-]+", "lastVersion=" + newVersion)
        propertiesFile.text = content

        def readmeFile = file('Readme.adoc')
        def readme = readmeFile.text
        readme = readme.replace('com.unblu.middleware:unblu-middleware-lib:' + lastVersion, 'com.unblu.middleware:unblu-middleware-lib:' + newVersion)
        readmeFile.text = readme
    }
}

jreleaser {
    signing {
        active = 'RELEASE'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                unblu {
                    active = 'RELEASE'
                    namespace = 'com.unblu'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    retryDelay = 30
                    maxRetries = 150
                }
            }
        }
    }
    //One releaser must be configured, see https://github.com/jreleaser/jreleaser/discussions/1725
    release {
        generic {
            skipRelease = true
        }
    }
}

model {
    tasks.unSnapshotVersion {
        dependsOn updateLastVersionValueTask
    }
}

release {
    failOnSnapshotDependencies = false
    buildTasks = [
            'checkLastVersionValue',
            'clean',
            'publish',
            'jreleaserDeploy'
    ]
    git {
        requireBranch.set('main')
    }
}

tasks.named('beforeReleaseBuild') {
    dependsOn tasks.named('verifyForRelease')
    dependsOn tasks.named('checkNoSnapshotDependencies')
}

tasks.matching { it.name == 'checkSnapshotDependencies' }.configureEach {
    enabled = false
}
